targets:
  $default:
    builders:
      # Rotalar dal başına dosyalara bölünür (lib/product/navigation/routes/*.dart);
      # her dosya kendi `part '…g.dart'` satırını taşır (CD-13).
      go_router_builder:go_router_builder:
        generate_for:
          - lib/product/navigation/**.dart
      riverpod_generator:
        options:
          provider_name_suffix: "Provider"
          provider_family_name_suffix: "Provider"
# json_serializable kökte çalışmaz: modeller packages/gu_data'dadır (packages/gu_data/build.yaml, D-09).
