# Yerel splash yapılandırması (PLAN §5.6.3). T-00: yalnızca dosya; çalıştırma T-46:
#   dart run flutter_native_splash:create --path=flutter_native_splash.yaml
# Renkler = design/extracted/registry.json#tokens.COLORS["bg.canvas"] (açık / koyu);
# parite testi: test/platform/native_splash_tokens_test.dart.
# image_dark: koyu amblemin PNG'si yok (placeholder-emblem-dark.svg); T-46'da 512 px PNG'ye çevrilip bağlanır.
flutter_native_splash:
  color: "#FAF9F6"
  color_dark: "#17191C"
  image: "assets/logo/placeholder-emblem@512.png"
  image_dark: "assets/logo/placeholder-emblem@512.png"
  android_12:
    color: "#FAF9F6"
    color_dark: "#17191C"
    image: "assets/logo/placeholder-emblem@512.png"
    icon_background_color: "#FAF9F6"
    icon_background_color_dark: "#17191C"
  android: true
  ios: true
  web: false
