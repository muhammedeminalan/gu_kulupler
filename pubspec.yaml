name: gu_kulupler
description: "GÜ Kulüpler — Gümüşhane Üniversitesi öğrenci kulüpleri için yönetim ve sosyal uygulama."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Pub workspace (D-11): kök uygulama + iki yerel paket. `resolution: workspace`
# yalnızca üye paketlerin pubspec'inde bulunur (kökte değil — pub kuralı).
workspace:
  - packages/gu_data
  - packages/gu_ui

dependencies:
  flutter:
    sdk: flutter

  # --- Yerel paketler (D-11) ---
  gu_data: ^0.1.0
  gu_ui: ^0.1.0

  # --- Yerelleştirme (TR/EN) ---
  flutter_localizations:
    sdk: flutter
  intl: any

  # --- State yönetimi, DI ve navigasyon ---
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  get_it: ^9.3.0
  go_router: ^18.0.2
  equatable: ^2.1.0 # 3.x değil: fake_cloud_firestore / firebase_auth_mocks ^2 ister (CD-14)

  # --- Arayüz ve yerel depolama ---
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.3
  shared_preferences: ^2.5.6

  # --- Cihaz servisleri (CD-08; her biri ilk kullanıldığı task'ta eklenir) ---
  connectivity_plus: ^7.3.1 # T-11: çevrimdışı durumu (Q-12)
  package_info_plus: ^10.2.2 # T-11: sürüm / build (DLG-26, SET-04)

  # --- Firebase (Mod C: firebase_messaging / cloud_functions yok — Q-02) ---
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_remote_config: ^6.7.0
  firebase_crashlytics: ^5.4.0

  # --- Kod üretimi ek açıklamaları ---
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  # firebase_storage_mocks yalnızca packages/gu_data'da (packages.md §3); kök testleri el yazımı fake kullanır.

flutter:
  uses-material-design: true
  generate: true

  config:
    enable-swift-package-manager: true

  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/covers/
    - assets/patterns/
    - assets/logo/

  # Paketli TTF'ler (D-12); google_fonts kullanılmaz.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
