# GitHub'da sürüm (Release) yayımlanınca web uygulamasını Firebase Hosting'e yükler:
# gu-kulupler.web.app/app/. Elle çalıştırmak için: Actions → "Web'i yayınla" → Run workflow.
#
# Gerekli gizli anahtar: FIREBASE_SERVICE_ACCOUNT_GU_KULUPLER (`firebase init hosting:github` oluşturur;
# yalnızca Hosting yetkili servis hesabı). Derleme `firebase.json` → hosting.predeploy →
# tool/build_web_hosting.sh ile yapılır; üretilen dosyalar commit edilmediği için önce codegen çalışır.
name: Web'i yayınla (Firebase Hosting)

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Derle ve yükle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al (sürüm etiketi)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Kod üretimi (build_runner + gen-l10n)
        run: bash tool/codegen.sh

      - name: Hosting'e yükle (predeploy web derlemesini alır)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GU_KULUPLER }}
          projectId: gu-kulupler
          channelId: live
