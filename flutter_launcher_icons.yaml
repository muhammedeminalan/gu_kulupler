# Uygulama ikonu yapılandırması (PLAN §5.6.3). T-00: yalnızca dosya; çalıştırma T-46:
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
# adaptive_icon_* anahtarları bilinçli olarak yok (ayrı ön plan varlığı yok; K-12 yer tutucu amblem).
