# Uygulama ikonu yapılandırması (PLAN §5.6.3). Çalıştırma (T-46, 2026-10-16):
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
# Kaynaklar assets/logo/ altında, yer tutucu amblemle (K-10 / K-12; resmî logo gelince aynı adlarla değiştirilir):
#   app-icon-1024.png            — Android eski (API < 26) ikonu (köşeleri yuvarlak, şeffaf)
#   app-icon-ios-1024.png        — iOS: tam kare, alfa yok (köşeleri iOS maskeler)
#   app-icon-foreground-1024.png — Android uyarlanabilir ön plan + tek renk (Android 13 temalı ikon); zemin #D00A2D
# PNG'ler app-icon-1024.svg geometrisinden üretilir (amblem: çatı + üç nokta).
flutter_launcher_icons:
  image_path: "assets/logo/app-icon-1024.png"
  image_path_ios: "assets/logo/app-icon-ios-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#D00A2D"
  adaptive_icon_foreground: "assets/logo/app-icon-foreground-1024.png"
  adaptive_icon_monochrome: "assets/logo/app-icon-foreground-1024.png"
